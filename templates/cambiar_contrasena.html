{% extends "base.html" %}

{% block title %}Cambiar Contraseña{% endblock %}

{% block content %}

<style>
    /* Nuevo: Wrapper para centrar el formulario en la página */
    .content-wrapper {
        display: flex;
        justify-content: center; /* Centra horizontalmente */
        align-items: center;     /* Centra verticalmente */
        min-height: 80vh;        /* Altura mínima para que el centrado vertical se vea bien */
    }

    /* Contenedor principal del formulario, ahora con un ancho máximo definido */
    .form-container-card {
        background-color: #ffffff;
        border-radius: 8px;
        padding: 2.5rem;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px; /* Ancho máximo del formulario */
    }

    .form-header h2 {
        text-align: center;
        font-size: 1.75rem;
        font-weight: 600;
        margin-bottom: 2rem;
        color: #343a40;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: #495057;
    }

    .form-control {
        display: block;
        width: 100%;
        padding: 0.8rem 1rem;
        font-size: 1rem;
        border: 1px solid #ced4da;
        border-radius: 4px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-control:focus {
        border-color: #80bdff;
        outline: 0;
        box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }

    .form-text-muted {
        color: #6c757d;
        font-size: 0.875em;
    }

    .form-actions {
        margin-top: 2rem;
    }

    /* Botón de ancho completo */
    .btn-primary {
        display: block;
        width: 100%;
        font-weight: 500;
        text-align: center;
        border: 1px solid transparent;
        padding: 0.8rem 1.5rem;
        font-size: 1rem;
        border-radius: 4px;
        text-decoration: none;
        cursor: pointer;
        color: #fff;
        background-color: #007bff;
        border-color: #007bff;
        transition: all 0.2s ease-in-out;
    }
</style>

<div class="content-wrapper">
    <div class="form-container-card">
        <div class="form-header">
            <h2>Cambiar Contraseña</h2>
        </div>

        <form method="POST" action="{{ url_for('cambiar_contrasena_route') }}">
            <div class="form-group">
                <label for="current_password">Contraseña Actual</label>
                <input type="password" id="current_password" name="current_password" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="new_password">Nueva Contraseña</label>
                <input type="password" id="new_password" name="new_password" class="form-control" required minlength="8">
                <small class="form-text-muted">Debe tener al menos 8 caracteres.</small>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirmar Nueva Contraseña</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Actualizar Contraseña</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
